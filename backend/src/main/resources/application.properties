# ===================================================================
# Online Home Automation Control Platform - Spring Boot Configuration
# ===================================================================

# Server Configuration
server.port=8080

# Application Name
spring.application.name=HomeAutomationPlatform

# -------------------------------------------------------------------
# Primary Database Configuration: MySQL
# Note: ${DB_USERNAME:root} means use environment variable DB_USERNAME, or default to 'root'
# -------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/home_automation_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# -------------------------------------------------------------------
# JWT (JSON Web Token) Security Settings
# 256-bit secure secret key and expiration (24 hours = 86400000 ms)
# -------------------------------------------------------------------
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expiration-ms=86400000

# -------------------------------------------------------------------
# Swagger / OpenAPI 3 Documentation Configuration
# Accessible at: http://localhost:8080/swagger-ui/index.html
# -------------------------------------------------------------------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# -------------------------------------------------------------------
# Task Scheduling Configuration (For Sensor & Energy Simulation)
# -------------------------------------------------------------------
spring.task.scheduling.pool.size=2
